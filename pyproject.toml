[project]
name = "hacksaws"
version = "0.4.0"
description = "A command-line utility for AWS profiles using dynamic authentication methods such as MFA."
authors = [
    { name = "Scott Ernst", email = "swernst@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.15"
keywords = ["aws", "authentication", "ecr", "mfa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "boto3[crt]>=1.41,<2",
    "pyyaml>=6.0,<7",
    "rich>=13.9,<15",
]

[dependency-groups]
dev = [
    "boto3-stubs[ecr,sts]>=1.40,<2",
    "mypy>=1.14",
    "packaging>=25.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "taskipy>=1.14",
]

[project.scripts]
hacksaws = "hacksaws:main"
test = "hacksaws._test_runner:main"

[project.urls]
Homepage = "https://github.com/rocketboosters/hacksaws"
Repository = "https://github.com/rocketboosters/hacksaws"
Documentation = "https://github.com/rocketboosters/hacksaws#readme"
Issues = "https://github.com/rocketboosters/hacksaws/issues"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C4",
    "C90",
    "D",
    "E",
    "ERA",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TCH",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"hacksaws/_cli.py" = [
    "C901", "E501", "FBT001", "PLR0911", "PLR0912", "PLR0915", "SLF001",
    "TRY003", "TRY203",
]
"hacksaws/_account_discovery.py" = [
    "ANN401", "PLR0911", "TRY003",
]
"hacksaws/_duration.py" = ["TRY003"]
"hacksaws/_ecr.py" = ["ANN401"]
"hacksaws/_policies.py" = [
    "ANN401", "C901", "E501", "PERF102", "PLR0912", "PLR0913", "PLR0915",
    "PLR1714", "PLR2004", "RUF059", "TRY003",
]
"hacksaws/_sessions.py" = [
    "ANN401", "ARG001", "B007", "C901", "E501", "PLC0415", "PLR0912",
    "PLR0913", "PLR0915", "PLR2004", "RUF059", "S603", "S607", "SIM105",
    "SLF001", "TRY003",
]
"hacksaws/_state.py" = [
    "C901", "E501", "PLR0912", "PLR0915", "PLR2004", "PTH105", "RUF059",
    "SIM105", "TRY003",
]
"hacksaws/_test_runner.py" = ["S603"]
"hacksaws/_iam_cli.py" = ["TRY003", "TRY301"]
"scripts/prettier.py" = ["S603"]
"**/tests/**" = [
    "ARG001",
    "ARG002",
    "FBT001",
    "N803",
    "PLC0415",
    "PLR0913",
    "PLR2004",
    "RET504",
    "S101",
    "SLF001",
    "TC003",
    "D103",
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# IAM command tests intentionally exercise argparse namespaces and lightweight
# recording doubles.  Keep production modules fully checked while suppressing
# only the dynamic-test-double diagnostics that cannot describe that runtime
# surface accurately.
[[tool.mypy.overrides]]
module = [
    "hacksaws.tests.test_iam_cli_scaffold",
    "hacksaws.tests.test_iam_policy_cli",
    "hacksaws.tests.test_iam_role_cli",
    "hacksaws.tests.test_iam_roles",
]
disable_error_code = [
    "arg-type",
    "attr-defined",
    "func-returns-value",
    "index",
    "method-assign",
]

[tool.pytest.ini_options]
testpaths = ["hacksaws/tests"]
cache_dir = ".cache/pytest"

[tool.coverage.run]
source = ["hacksaws"]
omit = ["hacksaws/tests/*"]

[tool.coverage.report]
precision = 2

[tool.taskipy.tasks]
format_ruff = "uvx ruff format"
format_prettier = "python scripts/prettier.py write"
format = "task format_ruff . && task format_prettier ."
lint_ruff = "uvx ruff check"
lint_ruff_format = "uvx ruff format --check"
lint_mypy = "mypy --install-types --non-interactive --ignore-missing-imports"
lint_prettier = "python scripts/prettier.py check"
lint = "task lint_ruff_format . && task lint_ruff . && task lint_mypy . && task lint_prettier ."
test = "python -m hacksaws._test_runner"
check = "task format && task lint && task test"
build = "uv build"

[tool.hatch.build]
artifacts = ["hacksaws/py.typed"]

[tool.hatch.build.targets.wheel]
packages = ["hacksaws"]
exclude = ["hacksaws/tests"]

[tool.hatch.build.targets.sdist]
exclude = ["hacksaws/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
