[project]
name = "hacksaws"
version = "0.3.1"
description = "A command-line utility for AWS profiles using dynamic authentication methods such as MFA."
authors = [
    { name = "Scott Ernst", email = "swernst@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.15"
keywords = ["aws", "authentication", "ecr", "mfa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.40,<2",
]

[dependency-groups]
dev = [
    "boto3-stubs[ecr,sts]>=1.40,<2",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "taskipy>=1.14",
]

[project.scripts]
hacksaws = "hacksaws:main"

[project.urls]
Homepage = "https://github.com/rocketboosters/hacksaws"
Repository = "https://github.com/rocketboosters/hacksaws"
Documentation = "https://github.com/rocketboosters/hacksaws#readme"
Issues = "https://github.com/rocketboosters/hacksaws/issues"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C4",
    "C90",
    "D",
    "E",
    "ERA",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TCH",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "ARG001",
    "ARG002",
    "FBT001",
    "N803",
    "PLC0415",
    "PLR0913",
    "PLR2004",
    "RET504",
    "S101",
    "SLF001",
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["hacksaws/tests"]
cache_dir = ".cache/pytest"

[tool.coverage.run]
source = ["hacksaws"]
omit = ["hacksaws/tests/*"]

[tool.taskipy.tasks]
format_ruff = "ruff format ."
format_prettier = "npm run format"
format = "task format_ruff && task format_prettier"
lint_ruff = "ruff check ."
lint_ruff_format = "ruff format --check ."
lint_mypy = "mypy hacksaws"
lint_prettier = "npm run format:check"
lint = "task lint_ruff_format && task lint_ruff && task lint_mypy && task lint_prettier"
test = "pytest --cov=hacksaws --cov-report=term-missing --cov-report=xml"
check = "task lint && task test"
build = "uv build"

[tool.hatch.build.targets.wheel]
packages = ["hacksaws"]
exclude = ["hacksaws/tests"]

[tool.hatch.build.targets.sdist]
exclude = ["hacksaws/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
